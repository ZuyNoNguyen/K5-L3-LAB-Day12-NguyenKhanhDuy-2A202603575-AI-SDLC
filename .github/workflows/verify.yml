name: Verify Test Contract & Determinism

on:
  push:
    branches: [ main ]
    tags: [ 'phase-*', 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Verification & Headless Contract Tests
        run: npm run verify
